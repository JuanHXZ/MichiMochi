name: CI/CD Backend (EC2 Self-Hosted)

on:
  push:
    branches:
      - develop
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  test:
    name: Build & Test Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript build
        run: npm run build

      - name: Run Jest tests
        env:
          NODE_ENV: test
        run: npm test

  deploy:
    name: Deploy Backend to EC2
    needs: test
    runs-on: self-hosted

    steps:
      - name: Pull latest changes and rebuild API container
        run: |
          cd "$HOME/MichiMochi"
          git fetch origin develop
          git reset --hard origin/develop
          cd backend
          docker compose -f docker-compose.prod.yml up -d --build api
          docker image prune -f

      - name: Verify healthcheck
        run: |
          cd "$HOME/MichiMochi/backend"
          for i in 1 2 3 4 5 6; do
            if docker compose -f docker-compose.prod.yml exec -T api node -e "fetch('http://localhost:5000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"; then
              echo "API healthy!"
              exit 0
            fi
            sleep 3
          done
          echo "Healthcheck failed"
          exit 1
